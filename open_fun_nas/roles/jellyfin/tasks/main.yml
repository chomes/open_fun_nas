---
- name: Create jellyfin folder for docker file
  ansible.builtin.file:
    path: /opt/services/jellyfin
    owner: root
    group: root
    mode: "0755"
    state: directory
- name: Deploy jellyfin compose file
  ansible.builtin.template:
    src: jellyfin.j2
    dest: /opt/services/jellyfin/docker-compose.yml
    owner: root
    group: root
    mode: "0755"
- name: Install jellyfin docker
  community.general.docker_compose:
    build: true
    state: present
    project_src: /opt/services/jellyfin
    pull: true
- name: Deploy proxy configuration
  ansible.builtin.template:
    src: jellyfin_proxy_server.j2
    dest: /etc/nginx/sites-available/"{{ jellyfin_fqdn_address }}"
    owner: root
    group: root
    mode: "0755"
  when: enable_jellyfin_proxy_server
- name: Create soft link for jellyfin site
  ansible.builtin.file:
    src: /etc/nginx/sites-available/"{{ jellyfin_fqdn_address }}"
    dest: /etc/nginx/sites-enabled/"{{ jellyfin_fqdn_address }}"
    state: link
  when: enable_jellyfin_proxy_server
  notify:
    - Restart nginx
    